name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: install / migrate / seed / lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crp
          POSTGRES_PASSWORD: crp
          POSTGRES_DB: crp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crp:crp@localhost:5432/crp?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # 不指定 version：由 package.json 的 packageManager 决定，避免两处版本冲突

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 engines.node 保持一致
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed data
        run: pnpm db:seed

      # AC1 要求 db:reset 可重复执行。这条命令会清空数据库，只允许在一次性环境里跑，
      # 所以放在 CI 的服务容器上验证，而不是让本机或人工去点。
      - name: Verify db:reset is repeatable
        run: pnpm db:reset && pnpm db:reset

      - name: Lint
        run: pnpm lint
      # 颜色对比度门禁：issue 正文那张表里的每一对「文字 on 底色」都写成断言，
      # 任何一对低于 WCAG 2.1 的阈值即失败（正文 4.5:1、控件边框 3:1）。
      # 纯读源码，不需要数据库与浏览器。
      - name: Contrast
        run: pnpm test:contrast


      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # 样式门禁：三层检查（L1 静态结构、L2 计算样式、L3 几何与整页截图）。
  # 和基线生成用同一个镜像 —— 截图与几何对字体敏感，换一套字体量出来的数字就变了，
  # 那不是样式坏了。镜像自带 Node 与 Chromium（Playwright 1.65.1 对应 revision 1255），
  # 不需要另外下载或缓存浏览器。
  style:
    name: 样式门禁（pnpm test:style）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.65.1-noble

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crp
          POSTGRES_PASSWORD: crp
          POSTGRES_DB: crp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 容器 job 通过 service 名连库，不走 127.0.0.1。
      DATABASE_URL: postgresql://crp:crp@postgres:5432/crp?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # 镜像里没有 corepack，直接装。版本只认 package.json 的 packageManager，
        # 这里不再写第二份，免得与锁文件对不上时以莫名报错的形式失败。
        run: |
          version="$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json | head -n 1)"
          npm i -g "pnpm@$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed data
        run: pnpm db:seed

      # 构建、起服务、取样、比对都在脚本里；--update 在这里会被脚本拒绝。
      - name: Run style gate
        run: pnpm test:style

  # 模块对照：拿 `.agents/spec/design/modules.json` 的清单，逐页比对实现里缺了哪些原型模块。
  # 判定只认 `className` 上下文里的字符串，口径见 `scripts/check-modules.ts`。
  #
  # **阻断**：MKACG-969/970/971/972 合并后 9 个页面与全局模块已齐备，这里去掉 `--report`
  # 改成阻断模式。任何页面再丢一个原型模块，这一步直接失败。
  modules:
    name: 模块对照
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # 不指定 version：由 package.json 的 packageManager 决定，避免两处版本冲突

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 默认模式：有缺失即退出码 1，阻断合并。
      - name: 比对模块清单
        run: pnpm check:modules

  # 验收用例集（MKACG-985）：功能 + 边界 + 权限三组，一条命令跑完。
  #
  # **非阻断**（`continue-on-error: true`）。用例集描述的是 PR #53 的界面规范 v2，界面重做
  # （MKACG-983 / MKACG-984）与本单并行：页面还没对齐时，涉及页面结构的用例本来就该是红的。
  # 等页面转绿之后，由后续单去掉这一行改成阻断 —— 现在设成阻断只会让每个 PR 都红，然后被无视。
  #
  # 这里不起服务、也不给 BASE_URL：界面组不在这条命令里（它要浏览器与已部署实例，
  # 见 `pnpm test:acceptance:ui`）。缺环境的用例在报告里是 skipped，不是 passed。
  acceptance:
    name: 验收用例（pnpm test:acceptance）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crp
          POSTGRES_PASSWORD: crp
          POSTGRES_DB: crp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crp:crp@localhost:5432/crp?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # 不指定 version：由 package.json 的 packageManager 决定，避免两处版本冲突

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed data
        run: pnpm db:seed

      # 断言失败时会打印「编号、预期、实际」，失败编号直接对着 test-cases.md 查。
      - name: 跑验收用例
        run: pnpm test:acceptance
